name: Build MY-KITBOOK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MY-KITBOOK-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q MY-KITBOOK-Android-Project.zip -d extracted
          test -f extracted/MY-KITBOOK-Android/settings.gradle

      - name: Fix legacy Kotlin duplicate classes
        run: |
          cat >> extracted/MY-KITBOOK-Android/app/build.gradle <<'EOF'
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon -p extracted/MY-KITBOOK-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-KITBOOK-debug-apk
          path: extracted/MY-KITBOOK-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
